# Official reopen F2E rerun of study_random_64_d52 (same seed/queries).
# Writes study_random_64_d52_opt.csv; do not overwrite study_random_64_d52.csv.
name: study_random_64_d52_opt
algorithms:
  - astar
  - sfbds_f2f
  - sfbds_f2e
seed: 212
timeout_sec: 60
output_dir: results/study/pair-bound
generator:
  kind: random_obstacles
  height: 64
  width: 64
  obstacle_densities: [0.50, 0.51, 0.52]
query_sample:
  count: 30
  min_manhattan: 16
