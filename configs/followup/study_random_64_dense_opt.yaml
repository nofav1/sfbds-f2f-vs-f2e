# Official reopen F2E rerun of study_random_64_dense (same seed/queries).
# Writes study_random_64_dense_opt.csv; do not overwrite study_random_64_dense.csv.
name: study_random_64_dense_opt
algorithms:
  - astar
  - sfbds_f2f
  - sfbds_f2e
seed: 210
timeout_sec: 60
output_dir: results/study/pair-bound
generator:
  kind: random_obstacles
  height: 64
  width: 64
  obstacle_densities: [0.30, 0.40, 0.45]
query_sample:
  count: 30
  min_manhattan: 24
