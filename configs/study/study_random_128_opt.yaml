# Official reopen F2E rerun of study_random_128 (same seed/queries).
# Writes study_random_128_opt.csv; do not overwrite study_random_128.csv.
name: study_random_128_opt
algorithms:
  - astar
  - sfbds_f2f
  - sfbds_f2e
seed: 110
timeout_sec: 60
output_dir: results/study/pair-bound
generator:
  kind: random_obstacles
  height: 128
  width: 128
  obstacle_densities: [0.10, 0.20, 0.30]
query_sample:
  count: 30
  min_manhattan: 48
